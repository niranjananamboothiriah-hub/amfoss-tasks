<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crypto Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
    <h1>Crypto Tracker</h1>
    <p>Track the cryptocurrency market in real time</p>
    <button id="themeButton">🌙 Dark Mode</button>
    </header>


    

    <main>

        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search cryptocurrency..."
            >
            <button id="searchButton">Search</button>
        </section>

        <section class="market-section">
            <h2>Market Overview</h2>

            <div id="cryptoList">
                <!-- Cryptocurrency cards will appear here -->
            </div>
        </section>

        <section class="chart-section">
            <h2>Price Chart</h2>

            <div class="time-buttons">
                <button>24H</button>
                <button>1W</button>
                <button>1M</button>
                <button>3M</button>
                <button>1Y</button>
            </div>

            <canvas id="priceChart"></canvas>
        </section>

        <section class="wishlist-section">
            <h2>⭐ My Wishlist</h2>

            <div id="wishlist">
                <!-- Favourite cryptocurrencies will appear here -->
            </div>
        </section>

    </main>

    <footer>
        <p>Crypto Tracker — AMFOSS Task 04</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
